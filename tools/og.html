<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Space Grotesk'; src: url('../assets/fonts/space-grotesk-latin.woff2') format('woff2'); font-weight: 400 500; }
@font-face { font-family: 'Manrope'; src: url('../assets/fonts/manrope-latin.woff2') format('woff2'); font-weight: 400 600; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #020817; color: #f8fafc; font-family: Manrope, sans-serif; }
.glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 12% 20%, rgb(99 102 241 / .35), transparent 70%), radial-gradient(ellipse 50% 60% at 100% 100%, rgb(99 102 241 / .25), transparent 70%); }
.shot { position: absolute; right: -120px; top: 120px; width: 640px; border-radius: 16px; overflow: hidden; border: 1px solid #334155; transform: rotate(-6deg); box-shadow: 0 40px 100px -20px rgb(0 0 0 / .8); background: #fff; }
.shot img { display: block; width: 100%; }
.shot2 { right: 60px; top: 330px; width: 420px; transform: rotate(-6deg); }
.copy { position: absolute; left: 72px; top: 72px; width: 620px; }
.brand { display: flex; align-items: center; gap: 16px; font-family: 'Space Grotesk'; font-weight: 500; font-size: 40px; }
.mark { width: 60px; height: 60px; border-radius: 14px; background: linear-gradient(180deg, #6366f1, #4338ca); display: grid; place-items: center; }
.mark svg { width: 38px; height: 38px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }
h1 { font-family: 'Space Grotesk'; font-weight: 500; font-size: 68px; line-height: 1.02; letter-spacing: -0.035em; margin: 48px 0 0; }
h1 span { color: #a5b4fc; }
p { max-width: 540px; font-size: 25px; line-height: 1.45; color: #cbd5e1; margin: 26px 0 0; }
.tags { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 12px; }
.tags b { font-weight: 600; font-size: 19px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgb(129 140 248 / .45); background: rgb(99 102 241 / .14); color: #e0e7ff; }
</style></head>
<body>
<div class="glow"></div>
<div class="shot"><img src="../assets/img/posters/chat.webp" alt=""></div>
<div class="shot shot2"><img src="../assets/img/posters/notes.webp" alt=""></div>
<div class="copy">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg></span>TeamUp</div>
  <h1>Your team's whole day, <span>on your own server.</span></h1>
  <p>Chat, video calls with meeting notes, tasks, calendar and files. No seat pricing.</p>
</div>
<div class="tags"><b>Open source, MIT</b><b>v1.0.0</b><b>Self-hosted</b></div>
</body></html>
